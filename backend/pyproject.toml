[tool.poetry]
name = "slppro-backend"
version = "0.1.0"
description = "SLP Pro backend (FastAPI)"
authors = ["Andrew Horton <andrew@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = "0.115.12"
uvicorn = {version = "0.24.0", extras=["standard"]}
gunicorn = "21.2.0"
sqlalchemy = "2.0.23"
alembic = "1.13.1"
pyodbc = "5.0.1"
python-dotenv = "1.0.0"
requests = "2.31.0"
httpx = "0.27.2"
passlib = {version = "1.7.4", extras=["bcrypt"]}
python-jose = {version = "3.3.0", extras=["cryptography"]}
msal = "1.31.0"
azure-identity = "1.15.0"
azure-keyvault-secrets = "4.7.0"
azure-storage-blob = "12.19.0"
email-validator = "2.0.0"
cryptography = "3.4.8"
msgraph-core = "1.0.0"
msgraph-sdk = "1.0.0"
openai = "1.78.0"
openai-agents = "0.0.14"
mcp = "1.6.0"
python-multipart = "0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
ruff = "0.4.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


