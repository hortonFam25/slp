[tool.poetry]
name = "slppro-backend"
version = "0.1.0"
description = "SLP Pro backend (FastAPI)"
authors = ["Andrew Horton <andrew@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = "0.115.12"
uvicorn = {version = "0.24.0", extras=["standard"]}
gunicorn = "21.2.0"
sqlalchemy = "2.0.23"
alembic = "1.13.1"
pyodbc = "5.0.1"
python-dotenv = "1.0.0"
requests = "2.31.0"
httpx = "0.27.2"
passlib = {version = "1.7.4", extras=["bcrypt"]}
python-jose = {version = "3.3.0", extras=["cryptography"]}
msal = "1.31.0"
azure-identity = "1.15.0"
azure-keyvault-secrets = "4.7.0"
azure-storage-blob = "12.19.0"
email-validator = "2.0.0"
cryptography = "3.4.8"
msgraph-core = "1.0.0"
msgraph-sdk = "1.0.0"
openai = "1.78.0"
openai-agents = "0.0.14"
mcp = "1.6.0"
python-multipart = "0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
ruff = "0.4.8"
# Fake caseload data for scripts/seed_dev.py. Dev/CI only — never ships.
faker = "25.9.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"



# ---------------------------------------------------------------------------
# Ruff — the linter CI runs (`ruff check backend`).
# ---------------------------------------------------------------------------
# The rule set below is deliberately a FLOOR, not a style guide. It is the set
# that the existing codebase passes today, so that turning CI on did not require
# a repo-wide reformat in the same change. What it catches:
#
#   E9   syntax errors and IO errors — the file does not parse at all
#   F63  comparisons that are always wrong (`is` on a literal, `==` on a tuple)
#   F7   misplaced statements (`break` outside a loop, `return` outside a def)
#   F82  undefined names — the typo-that-becomes-a-500 rule
#
# Everything else (unused imports, import order, line length, naming) is
# currently NOT enforced.
#
# To tighten, add one rule family at a time, run `ruff check backend --fix`,
# review the diff, and keep it only if the result is green:
#
#   select = ["E9", "F63", "F7", "F82", "F401"]        # + unused imports
#   select = [..., "I"]                                # + import sorting
#   select = ["E", "F", "I", "UP", "B"]                # the usual full baseline
#
# Do NOT tighten this in the same PR as a feature — a lint sweep should be its
# own reviewable change.

[tool.ruff]
# The App Service runs PYTHON|3.11 and CI pins 3.11, so lint for 3.11 even
# though pyproject's dependency range still allows 3.9.
target-version = "py311"
line-length = 120

extend-exclude = [
    "venv",
    ".venv",
    "app/alembic/versions",   # generated migration scripts, never hand-edited
    "sqlalchemy_trigger_fix.py",  # a documentation snippet, not importable code
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# One pre-existing F821 hit, quarantined per-file so the rule stays live for
# the other ~200 modules instead of being switched off wholesale. It is real and
# it wants a code change, which is why it is listed here by hand rather than
# blanket-ignored — delete the entry once the file is fixed and CI will start
# guarding it again.
#
#   therapy_session_repository.py:248 — `'SessionObjectiveUpdate'` is a string
#     annotation for a class that is never imported. Harmless at runtime (the
#     annotation is never evaluated), but it wants an
#     `if TYPE_CHECKING:` import to be honest.
#
# time_block_repository.py used to be listed here too: `Appointment` was used in
# remove_student_with_auto_rescheduling() with no import in scope — a live
# NameError, not a lint nit. The import now sits in the file header, the rule is
# green, and tests/test_time_block_repository.py keeps it that way.
[tool.ruff.lint.per-file-ignores]
"app/repositories/therapy_session_repository.py" = ["F821"]
